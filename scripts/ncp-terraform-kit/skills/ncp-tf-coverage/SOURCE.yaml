#
# Everything else in this skill is maintained with the kit. The kit owns the
# scripts, so only the vendored document records a source commit.
#
# The commit identifies the exact content. A retrieval timestamp is deliberately
# absent: it can disagree with the commit and proves nothing the commit does not
# already prove.
#
# Refreshing the file is a change to the kit, not an operator action. Replace
# the file and update its commit here in the same change.

