#
# Enterprise RA Network Operator self-validation integration requirements.
# Structured from the PRD supplied for the Kubernetes Launch Kit integration.
# Render the publishable Markdown view with `make plan`.

source: network-operator-prd
format: project-prd
title: Enterprise RA Network Operator Self-Validation Integration PRD
version: prd-snapshot-2026-08-04
owner: NVIDIA Network Operator team
requirements:
  - req_id: ENT-REQ-000
    section: Ownership
    area: Integration ownership
    description: The Network Operator team owns and maintains the integration solution, including compatibility updates for the underlying tests.
    status: active
  - req_id: ENT-REQ-001
    section: Framework Integration
    area: Standard validation workflow
    description: Integrate Network Operator self-validation tests into AI Cloud Validation so Enterprise and AI Cloud Ready users can run them through the standard workflow.
    status: active
  - req_id: ENT-REQ-002
    section: Framework Integration
    area: Launch Kit reuse
    description: Reuse applicable Kubernetes Launch Kit validation components, including topology discovery, manifest readiness, RDMA connectivity, and RDMA bandwidth.
    status: active
  - req_id: ENT-REQ-003
    section: Framework Integration
    area: Selection and program profiles
    description: Support individual and grouped Network Operator validation, with Enterprise and AI Cloud Ready profiles able to mark checks required or optional.
    status: active
  - req_id: ENT-REQ-004
    section: Framework Integration
    area: Runtime parameters
    description: Expose applicable runtime parameters such as namespace, node selector, network and driver modes, rail and network names, resource and IP pool names, GPU count, and timeout.
    status: active
  - req_id: ENT-REQ-005
    section: Network Validation
    area: Ethernet and RoCE
    description: Validate SR-IOV Network RDMA and RDMA Shared scenarios, including secondary network attachment, RDMA device availability, pod-to-pod RDMA or RoCE connectivity, and basic bandwidth.
    status: active
  - req_id: ENT-REQ-006
    section: Network Validation
    area: InfiniBand
    description: Validate InfiniBand SR-IOV and RDMA Shared with IPoIB scenarios, including IB device availability, pod network attachment, and pod-to-pod InfiniBand connectivity.
    status: active
  - req_id: ENT-REQ-007
    section: Network Validation
    area: Host-device networking
    description: Validate host-device networking for Kubernetes workers running in virtual machines, covering both Ethernet or RoCE and InfiniBand.
    status: active
  - req_id: ENT-REQ-008
    section: Network Validation
    area: GPUDirect RDMA
    description: Validate GPUDirect RDMA peer-to-peer connectivity between GPU-enabled pods across supported worker nodes.
    status: active
  - req_id: ENT-REQ-009
    section: Network Validation
    area: Deployment health
    description: Validate Network Operator deployment health and required resources for the selected mode, including policies, secondary networks, IP pools, Multus and CNI components, and drivers.
    status: active
  - req_id: ENT-REQ-010
    section: Lifecycle Safety
    area: State restoration
    description: For tests that modify Network Operator or cluster state, capture the pre-test configuration and restore the original Network Operator state after success or failure.
    status: active
  - req_id: ENT-REQ-011
    section: Catalog and Documentation
    area: Catalog metadata
    description: Add catalog entries for all tests with owner, labels, dependencies, descriptions, and required YAML updates while following repository contribution standards.
    status: active
  - req_id: ENT-REQ-012
    section: Catalog and Documentation
    area: Prerequisites
    description: Document the required cluster prerequisites for each validation area.
    status: active
  - req_id: ENT-REQ-013
    section: Reporting
    area: Results and evidence
    description: Integrate pass or fail status, logs, Launch Kit reports, generated manifests, Kubernetes state, connectivity results, and bandwidth results into AI Cloud Validation reporting, catalog, and AI Cloud Labs artifacts.
    status: active
