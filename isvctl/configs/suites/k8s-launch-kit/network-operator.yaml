# One l8k validate run feeds every catalog test below. Each test reports one
# native Launch Kit JUnit suite: the deployment-state suite, or one
# connectivity family on one fabric. Launch Kit only runs the configured
# fabric, so the other fabric's four tests skip.

version: "1.0"

tests:
  description: "Network Operator validation through Kubernetes Launch Kit"

  settings:
    show_skipped_tests: false

  validations:
    network_operator:
      step: launch_kit_validate
      checks:
        K8sNetworkOperatorDeployment:
          test_id: "N/A"
          labels: ["kubernetes", "network_operator", "slow"]
          requires: [kubernetes]
        K8sEastWestNetworkICMPPing-ethernet:
          test_id: "N/A"
          labels: ["kubernetes", "network_operator", "slow"]
          requires: [kubernetes]
          fabric: ethernet
        K8sEastWestNetworkICMPPing-infiniband:
          test_id: "N/A"
          labels: ["kubernetes", "network_operator", "slow"]
          requires: [kubernetes]
          fabric: infiniband
        K8sEastWestNetworkRDMAPing-ethernet:
          test_id: "N/A"
          labels: ["kubernetes", "network_operator", "slow"]
          requires: [kubernetes]
          fabric: ethernet
        K8sEastWestNetworkRDMAPing-infiniband:
          test_id: "N/A"
          labels: ["kubernetes", "network_operator", "slow"]
          requires: [kubernetes]
          fabric: infiniband
        K8sEastWestNetworkIBWriteBandwidth-ethernet:
          test_id: "N/A"
          labels: ["kubernetes", "network_operator", "slow"]
          requires: [kubernetes]
          fabric: ethernet
        K8sEastWestNetworkIBWriteBandwidth-infiniband:
          test_id: "N/A"
          labels: ["kubernetes", "network_operator", "slow"]
          requires: [kubernetes]
          fabric: infiniband
        K8sEastWestNetworkDMABufBandwidth-ethernet:
          test_id: "N/A"
          labels: ["kubernetes", "network_operator", "slow"]
          requires: [kubernetes]
          fabric: ethernet
        K8sEastWestNetworkDMABufBandwidth-infiniband:
          test_id: "N/A"
          labels: ["kubernetes", "network_operator", "slow"]
          requires: [kubernetes]
          fabric: infiniband
