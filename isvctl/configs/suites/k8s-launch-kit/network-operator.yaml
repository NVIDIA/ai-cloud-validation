# Network Operator validation through the Kubernetes Launch Kit CLI.
#
# This suite contains catalog and result interpretation only. Providers own the
# command sequence and bind these checks to actual l8k command output. The
# generic provider is ../../providers/k8s-launch-kit/config/provider.yaml.

version: "1.0"

tests:
  description: "Network Operator self-validation through Kubernetes Launch Kit"

  settings:
    show_skipped_tests: false

  validations:
    network_operator:
      checks:
        LaunchKitKubernetesPrerequisiteCheck:
          step: launch_kit_kubernetes_preflight
          test_id: "N/A"
          labels: ["era", "kubernetes", "ncp", "network_operator", "prerequisite", "slow"]
          requires: [kubernetes]

        LaunchKitDeploymentHealthCheck:
          step: launch_kit_validate
          test_id: "K8S42-01"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]

        LaunchKitSriovReadinessCheck:
          step: launch_kit_validate
          test_id: "K8S42-02"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]
          discover_output: "{{ steps.launch_kit_discover | tojson }}"

        LaunchKitRdmaConnectivityCheck:
          step: launch_kit_validate
          test_id: "K8S42-03"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]

        LaunchKitRoceCheck:
          step: launch_kit_validate
          test_id: "K8S42-04"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]
          discover_output: "{{ steps.launch_kit_discover | tojson }}"

        LaunchKitInfiniBandCheck:
          step: launch_kit_validate
          test_id: "K8S42-05"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]
          discover_output: "{{ steps.launch_kit_discover | tojson }}"

        LaunchKitHostDeviceCheck:
          step: launch_kit_validate
          test_id: "K8S42-06"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]
          discover_output: "{{ steps.launch_kit_discover | tojson }}"

        LaunchKitGpuDirectRdmaCheck:
          step: launch_kit_validate
          test_id: "K8S42-07"
          labels: ["era", "gpudirect", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]

        LaunchKitTopologyDiscoveryCheck:
          step: launch_kit_discover
          test_id: "K8S42-08"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]

        LaunchKitSecondaryNetworkCheck:
          step: launch_kit_validate
          test_id: "K8S42-09"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]
          discover_output: "{{ steps.launch_kit_discover | tojson }}"

        LaunchKitRdmaSharedCheck:
          step: launch_kit_validate
          test_id: "K8S42-10"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]
          discover_output: "{{ steps.launch_kit_discover | tojson }}"

        LaunchKitIcmpConnectivityCheck:
          step: launch_kit_validate
          test_id: "K8S42-11"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]

        LaunchKitRdmaBandwidthCheck:
          step: launch_kit_validate
          test_id: "K8S42-12"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]

        LaunchKitMultirailCheck:
          step: launch_kit_validate
          test_id: "K8S42-13"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]
          discover_output: "{{ steps.launch_kit_discover | tojson }}"

        LaunchKitEvidenceCaptureCheck:
          step: launch_kit_validate
          test_id: "K8S42-15"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]
          prepare_output: "{{ steps.launch_kit_prepare | default({}) | tojson }}"
          verify_output: "{{ steps.launch_kit_verify | tojson }}"
          preflight_output: "{{ steps.launch_kit_kubernetes_preflight | tojson }}"
          discover_output: "{{ steps.launch_kit_discover | tojson }}"
          generate_output: "{{ steps.launch_kit_generate | tojson }}"
          deploy_output: "{{ steps.launch_kit_deploy | tojson }}"
