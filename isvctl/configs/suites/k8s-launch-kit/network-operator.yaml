# One catalog test consumes the connectivity matrix emitted by l8k validate.
# Fabric, deployment type, enabled checks, and all Launch Kit parameters belong
# to the supplied complete user config; they are prerequisites, not separate
# AI Cloud Validation use cases.

version: "1.0"

tests:
  description: "Network Operator connectivity validation through Kubernetes Launch Kit"

  settings:
    show_skipped_tests: false

  validations:
    network_operator:
      checks:
        LaunchKitConnectivityCheck:
          step: launch_kit_validate
          test_id: "K8S42-01"
          labels: ["era", "kubernetes", "ncp", "network_operator", "slow"]
          requires: [kubernetes]
