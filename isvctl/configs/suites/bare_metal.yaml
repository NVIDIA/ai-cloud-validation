# Bare Metal (BMaaS) Validation - Canonical Contract
#
# Validations-only contract for bare metal. Provider configs import this
# file and supply their own commands (steps + scripts).
#
# This file defines WHAT to validate, not HOW to run it. Each validation
# only inspects JSON output fields. As long as your scripts output the
# right fields, the validations pass regardless of which cloud you use.
#
# Quick start:
#   1. Copy providers/my-isv/config/bare_metal.yaml to providers/<your-platform>/config/bare_metal.yaml
#   2. Replace stub paths with your platform scripts
#   3. Run: uv run isvctl test run -f isvctl/configs/providers/<your-platform>/config/bare_metal.yaml
#
# See also:
#   - my-isv living example: providers/my-isv/config/bare_metal.yaml
#   - AWS reference: providers/aws/config/bare_metal.yaml + providers/aws/scripts/bare_metal/
#   - Per-step field breakdown: ../suites/README.md

version: "1.0"

tests:
  capability: bare_metal
  cluster_name: "bm-validation"
  description: "Bare metal (BMaaS) GPU validation tests"

  settings:
    # Provider-specific - override in your provider config
    region: ""
    instance_type: "{{instance_type}}" # Supply your platform-equivalent bare-metal/GPU instance type
    teardown_flag: "{{(env.BM_SKIP_TEARDOWN == 'true') | ternary('--skip-destroy', '')}}"

  # ─── Validations ─────────────────────────────────────────────────
  # These are PROVIDER-AGNOSTIC. They only check JSON field names/values.
  validations:
    setup_checks:
      step: launch_instance
      checks:
        BmHostRunningCheck:
          test_id: "N/A"
          labels: ["bare_metal"]
          expected_state: "running"
          description: "Check the bare metal host reaches the running state after launch"
          compose:
            - InstanceStateCheck

    list_instances:
      step: list_instances
      checks:
        BmHostListedCheck:
          # CNP01-11 (list nodes) is a VMaaS plan item; the BMaaS plan has no equivalent list-nodes item.
          test_id: "N/A"
          labels: ["bare_metal"]
          min_count: 1
          target_instance: "{{steps.launch_instance.instance_id}}"
          description: "Check the bare metal host appears when hosts are listed"
          compose:
            - InstanceListCheck

    tag_checks:
      step: verify_tags
      checks:
        BmHostTaggedCheck:
          test_id: "CNP05-01"
          labels: ["bare_metal", "min_req"]
          required_keys: ["Name", "CreatedBy"]
          description: "Check the bare metal host carries the required tags"
          compose:
            - InstanceTagCheck

    topology_placement:
      step: topology_placement
      checks:
        BmTopologyPlacementCheck:
          test_id: "CNP01-04"
          labels: ["bare_metal", "min_req"]

    serial_console:
      step: serial_console
      checks:
        BmSerialConsoleCheck:
          test_id: "CNP06-01"
          labels: ["bare_metal", "min_req"]
          description: "Check the bare metal host's serial console is reachable"
          compose:
            - SerialConsoleCheck
        SerialConsoleRetentionCheck:
          test_id: "CNP06-02"
          labels: ["bare_metal", "min_req"]

    cloud_init:
      step: launch_instance
      checks:
        BmCloudInitCheck:
          test_id: "BOOT02-01"
          labels: ["bare_metal", "min_req", "ssh"]
          description: "Check cloud-init completed on the bare metal host"
          compose:
            - CloudInitCheck

    # BOOT01-03 proven from the bare-metal run: the host is running and the
    # image it booted is the configured one. The image-registry suite proves the
    # same id from its own install_image_bm step, so providers that can install a
    # metal host inside the image-registry run need not implement verify_image.
    image_installed:
      step: verify_image
      checks:
        BmHostRunsExpectedImageCheck:
          test_id: "BOOT01-03"
          labels: ["bare_metal", "image_registry", "min_req"]
          description: "Check a running bare metal host reports the OS image it was configured with"
          compose:
            - StepSuccessCheck
            - FieldExistsCheck:
                fields: ["instance_id", "image_id", "image_name", "instance_state"]
            - InstanceStateCheck:
                expected_state: "running"

    instance_info:
      step: describe_instance
      checks:
        BmHostStateReportedCheck:
          test_id: "N/A"
          labels: ["bare_metal"]
          expected_state: "running"
          description: "Check the platform reports the bare metal host as running when described"
          compose:
            - InstanceStateCheck

    ssh:
      step: describe_instance
      checks:
        # No BMaaS plan item for a host-OS image check (VMAAS-XX-05 is VM-only),
        # so the OS assertion rides along with the reachability one.
        BmHostReadyCheck:
          test_id: "BMAAS03-01"
          labels: ["bare_metal", "ssh"]
          description: "Check the bare metal host answers SSH and reports the expected OS"
          compose:
            - ConnectivityCheck
            - OsCheck:
                expected_os: "ubuntu"

    gpu:
      step: describe_instance
      checks:
        BmGpusPresentCheck:
          test_id: "BMAAS08-01"
          labels: ["bare_metal", "ssh", "gpu"]
          expected_gpus: 8
          description: "Check the bare metal host exposes the expected number of GPUs"
          compose:
            - GpuCheck

    host_os:
      step: describe_instance
      checks:
        # vCPU pinning / PCI passthrough / host-software are VMAAS plan items;
        # the BMaaS plan has no equivalent, so these are intentional gaps here.
        # They stay three tests because their labels differ: only the PCI one is
        # gpu-scoped, and merging would drag the other two into gpu filtering.
        BmVcpuPinningCheck:
          test_id: "N/A"
          labels: ["bare_metal", "ssh"]
          description: "Check the bare metal host reports its vCPU pinning layout"
          compose:
            - VcpuPinningCheck
        BmPciBusCheck:
          test_id: "N/A"
          labels: ["bare_metal", "ssh", "gpu"]
          expected_gpus: 8
          description: "Check the expected GPUs are visible on the bare metal host's PCI bus"
          compose:
            - PciBusCheck
        BmHostSoftwareCheck:
          test_id: "N/A"
          labels: ["bare_metal", "ssh"]
          description: "Check the expected host software is installed on the bare metal host"
          compose:
            - HostSoftwareCheck

    # Per-host status log sampling: verify journalctl/dmesg
    # are emitting fresh entries within max_age_minutes. Pass if at least
    # one source has recent entries (set required_sources to enforce all).
    host_status_logs:
      step: host_status_log
      checks:
        BmHostStatusLogCheck:
          test_id: "BMAAS07-01"
          labels: ["bare_metal"]

    # GPU stress test - PyTorch matrix multiplications on all GPUs
    gpu_stress:
      step: describe_instance
      checks:
        BmGpuStressCheck:
          test_id: "BMAAS09-01"
          labels: ["bare_metal", "gpu", "min_req", "ssh", "workload"]
          runtime: 30
          memory_gb: 16

    # NCCL AllReduce - validates GPU-to-GPU communication (NVLink/NVSwitch)
    nccl:
      step: describe_instance
      checks:
        BmNcclCheck:
          test_id: "BMAAS11-01"
          labels: ["bare_metal", "gpu", "min_req", "ssh", "workload"]

    # DDP training workload - validates full training stack
    training:
      step: describe_instance
      checks:
        BmTrainingCheck:
          test_id: "BMAAS12-01"
          labels: ["bare_metal", "gpu", "min_req", "ssh", "workload"]
          steps: 50

    # Network / interconnect checks
    nvlink:
      step: describe_instance
      checks:
        BmNvlinkCheck:
          test_id: "BMAAS06-01"
          labels: ["bare_metal", "ssh", "gpu", "network"]

    infiniband:
      step: describe_instance
      checks:
        BmInfiniBandCheck:
          test_id: "BMAAS06-01"
          labels: ["bare_metal", "gpu", "network", "ssh"]

    ethernet:
      step: describe_instance
      checks:
        BmEthernetCheck:
          test_id: "BMAAS06-01"
          labels: ["bare_metal", "gpu", "network", "ssh"]
          ping_target: "8.8.8.8"

    driver_info:
      step: describe_instance
      checks:
        # No BMaaS plan item for a host driver/kernel check (VMAAS-XX-07 is VM-only).
        BmGpuDriverCheck:
          test_id: "N/A"
          labels: ["bare_metal", "ssh", "gpu"]
          description: "Check the bare metal host reports a usable GPU driver and kernel"
          compose:
            - DriverCheck

    cpu_info:
      step: describe_instance
      checks:
        BmCpuInfoCheck:
          test_id: "N/A"
          labels: ["bare_metal", "ssh"]
          description: "Check the bare metal host reports its CPU topology"
          compose:
            - CpuInfoCheck

    container_runtime:
      step: describe_instance
      checks:
        BmContainerRuntimeCheck:
          test_id: "N/A"
          labels: ["bare_metal", "ssh", "gpu", "workload", "slow"]
          description: "Check the bare metal host runs a GPU-enabled container"
          compose:
            - ContainerRuntimeCheck

    stop_checks:
      step: stop_instance
      checks:
        BmHostStoppedCheck:
          test_id: "CNP01-07"
          labels: ["bare_metal", "min_req"]
          description: "Check the bare metal host stops on request"
          compose:
            - InstanceStopCheck

    start_checks:
      step: start_instance
      checks:
        BmHostStartedCheck:
          test_id: "CNP01-08"
          labels: ["bare_metal", "min_req"]
          description: "Check the bare metal host starts again after being stopped"
          compose:
            - InstanceStartCheck
        BmIdentifierStableAfterStartCheck:
          test_id: "N/A"
          labels: ["bare_metal", "min_req"]
          reference_id: "{{steps.launch_instance.instance_id}}"
          description: "Check the bare metal host keeps its identifier across a start"
          compose:
            - StableIdentifierCheck

    # SSH/GPU checks bound to start_instance / reboot_instance use the IP
    # captured by describe_instance (which runs last, post-power-cycle) - the
    # IPs in start/reboot step outputs are stale on platforms that reassign
    # public IPs across power-cycle.
    start_ssh:
      step: start_instance
      checks:
        BmHostReadyAfterStartCheck:
          test_id: "BMAAS03-01"
          labels: ["bare_metal", "ssh"]
          host: "{{steps.describe_instance.public_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"
          description: "Check the bare metal host answers SSH with the expected OS after a start"
          compose:
            - ConnectivityCheck
            - OsCheck:
                expected_os: "ubuntu"

    start_gpu:
      step: start_instance
      checks:
        BmGpusPresentAfterStartCheck:
          test_id: "BMAAS08-01"
          labels: ["bare_metal", "ssh", "gpu"]
          host: "{{steps.describe_instance.public_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"
          expected_gpus: 8
          description: "Check the GPUs are still present after a start"
          compose:
            - GpuCheck

    reboot_checks:
      step: reboot_instance
      checks:
        BmHostRebootedCheck:
          test_id: "CNP01-05"
          labels: ["bare_metal", "min_req"]
          max_uptime: 600
          description: "Check the bare metal host reboots on request"
          compose:
            - InstanceRebootCheck
        BmIdentifierStableAfterRebootCheck:
          test_id: "CNP08-01"
          labels: ["bare_metal", "min_req"]
          reference_id: "{{steps.launch_instance.instance_id}}"
          description: "Check the bare metal host keeps its identifier across a reboot"
          compose:
            - StableIdentifierCheck

    reboot_state:
      step: reboot_instance
      checks:
        BmHostRunningAfterRebootCheck:
          test_id: "N/A"
          labels: ["bare_metal"]
          expected_state: "running"
          description: "Check the bare metal host returns to the running state after a reboot"
          compose:
            - InstanceStateCheck

    reboot_ssh:
      step: reboot_instance
      checks:
        BmHostReadyAfterRebootCheck:
          test_id: "BMAAS03-01"
          labels: ["bare_metal", "ssh"]
          host: "{{steps.describe_instance.public_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"
          description: "Check the bare metal host answers SSH with the expected OS after a reboot"
          compose:
            - ConnectivityCheck
            - OsCheck:
                expected_os: "ubuntu"

    reboot_gpu:
      step: reboot_instance
      checks:
        BmGpusPresentAfterRebootCheck:
          test_id: "BMAAS08-01"
          labels: ["bare_metal", "ssh", "gpu"]
          host: "{{steps.describe_instance.public_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"
          expected_gpus: 8
          description: "Check the GPUs are still present after a reboot"
          compose:
            - GpuCheck

    power_cycle_checks:
      step: power_cycle_instance
      checks:
        BmHostPowerCycledCheck:
          test_id: "CNP01-06"
          labels: ["bare_metal", "min_req"]
          max_recovery_time: 900
          description: "Check the bare metal host recovers after a power cycle"
          compose:
            - InstancePowerCycleCheck
        BmIdentifierStableAfterPowerCycleCheck:
          test_id: "N/A"
          labels: ["bare_metal", "min_req"]
          reference_id: "{{steps.launch_instance.instance_id}}"
          description: "Check the bare metal host keeps its identifier across a power cycle"
          compose:
            - StableIdentifierCheck

    power_cycle_state:
      step: power_cycle_instance
      checks:
        BmHostRunningAfterPowerCycleCheck:
          test_id: "N/A"
          labels: ["bare_metal"]
          expected_state: "running"
          description: "Check the bare metal host returns to the running state after a power cycle"
          compose:
            - InstanceStateCheck

    power_cycle_ssh:
      step: power_cycle_instance
      checks:
        BmHostReadyAfterPowerCycleCheck:
          test_id: "BMAAS03-01"
          labels: ["bare_metal", "ssh"]
          description: "Check the bare metal host answers SSH with the expected OS after a power cycle"
          compose:
            - ConnectivityCheck
            - OsCheck:
                expected_os: "ubuntu"

    power_cycle_gpu:
      step: power_cycle_instance
      checks:
        BmGpusPresentAfterPowerCycleCheck:
          test_id: "BMAAS08-01"
          labels: ["bare_metal", "ssh", "gpu"]
          expected_gpus: 8
          description: "Check the GPUs are still present after a power cycle"
          compose:
            - GpuCheck

    # Reinstall validations (skipped when reinstall_instance step is skipped)
    reinstall_state:
      step: reinstall_instance
      checks:
        BmHostRunningAfterReinstallCheck:
          test_id: "N/A"
          labels: ["bare_metal"]
          expected_state: "running"
          description: "Check the bare metal host returns to the running state after a reinstall"
          compose:
            - InstanceStateCheck
        BmIdentifierStableAfterReinstallCheck:
          test_id: "CNP08-02"
          labels: ["bare_metal", "min_req"]
          reference_id: "{{steps.launch_instance.instance_id}}"
          description: "Check the bare metal host keeps its identifier across a reinstall"
          compose:
            - StableIdentifierCheck

    reinstall_ssh:
      step: reinstall_instance
      checks:
        BmHostReadyAfterReinstallCheck:
          test_id: "BMAAS03-01"
          labels: ["bare_metal", "ssh"]
          description: "Check the bare metal host answers SSH with the expected OS after a reinstall"
          compose:
            - ConnectivityCheck
            - OsCheck:
                expected_os: "ubuntu"

    reinstall_gpu:
      step: reinstall_instance
      checks:
        BmGpusPresentAfterReinstallCheck:
          test_id: "BMAAS08-01"
          labels: ["bare_metal", "ssh", "gpu"]
          expected_gpus: 8
          description: "Check the GPUs are still present after a reinstall"
          compose:
            - GpuCheck

    nim_inference:
      step: deploy_nim
      checks:
        BmNimInferenceReadyCheck:
          test_id: "BMAAS10-01"
          labels: ["bare_metal", "gpu", "min_req", "slow", "ssh", "workload"]
          description: "Check the deployed NIM is healthy, exposes its model, and answers an inference request"
          compose:
            - NimHealthCheck
            - NimModelCheck
            - NimInferenceCheck:
                prompt: "What is CUDA?"
                max_tokens: 50

    nim_teardown:
      step: teardown_nim
      checks:
        BmNimDeploymentDeletedCheck:
          test_id: "N/A"
          labels: ["bare_metal"]
          description: "Check the NIM deployment on the bare metal host is removed"
          compose:
            - StepSuccessCheck

    teardown_checks:
      step: teardown
      checks:
        BmResourcesDeletedCheck:
          test_id: "N/A"
          labels: ["bare_metal"]
          description: "Check the teardown step reports the host and its resources released"
          compose:
            - StepSuccessCheck

    teardown_verification:
      step: verify_teardown
      checks:
        BmHostTerminatedCheck:
          test_id: "N/A"
          labels: ["bare_metal"]
          description: "Check the platform independently confirms the host is gone, rather than trusting teardown's own report"
          compose:
            - StepSuccessCheck

    # Hardware ingestion: expected-machine manifest vs discovered machines.
    # Only runs for providers that implement the verify_ingestion step.
    ingestion_check:
      step: verify_ingestion
      checks:
        HardwareIngestionCheck:
          test_id: "HWING01-01"
          labels: ["bare_metal", "ingestion"]
          min_machines: 1
          expected_status: ["Ready", "InUse"]
          require_healthy: true

    # DPU health: presence, agent heartbeat, and machine-level health alerts.
    # Only runs for providers that implement the check_dpu_health step.
    dpu_health:
      step: check_dpu_health
      checks:
        BmDpuHealthCheck:
          test_id: "BMAAS05-01"
          labels: ["bare_metal", "dpu"]
          require_heartbeat: true

    # DPU overlay readiness as the platform API reports it. No provider
    # implements check_dpu_network yet (skips as step_not_configured).
    # Not BMAAS06-01 — that is proven over SSH by the fabric checks above.
    dpu_network:
      step: check_dpu_network
      checks:
        BmDpuNetworkCheck:
          test_id: "N/A"
          labels: ["bare_metal", "dpu", "network"]
          require_bgp: true

    # Governance metrics (CAP01-01): the provider's governance API must
    # surface Delivered, Healthy, Reserved, and Active counts for nodes and
    # GPUs. Only runs for providers that implement the
    # query_governance_metrics step.
    governance_metrics:
      step: query_governance_metrics
      checks:
        GovernanceMetricsCheck:
          test_id: "CAP01-01"
          labels: ["bare_metal", "governance", "min_req"]
          min_delivered_nodes: 1

    # Fleet management API (CAP02-01): the resource governance API must return a
    # complete record for every node -- identity, Healthy/Unhealthy
    # classification, the workload it is running, creation time, hardware type,
    # GPU count, owning account and project, in-use flag, and region. Only runs
    # for providers that implement the query_fleet_inventory step.
    fleet_inventory:
      step: query_fleet_inventory
      checks:
        FleetManagementApiCheck:
          test_id: "CAP02-01"
          labels: ["bare_metal", "governance", "min_req"]
          min_nodes: 1

    # Resource discovery API (CAP03-01): newly delivered capacity must be
    # discoverable from a centralized index rather than handed over out of band,
    # and each entry must carry a stable identifier. The step polls the index
    # repeatedly so identifier stability is observed rather than asserted;
    # min_polls is the floor that keeps a single-shot step from passing this
    # vacuously. A delivery reason is reported when the index states one but is
    # not asserted -- no provider API is known to expose it as a dedicated
    # field. Only runs for providers that implement the
    # query_resource_discovery step.
    resource_discovery:
      step: query_resource_discovery
      checks:
        ResourceDiscoveryApiCheck:
          test_id: "CAP03-01"
          labels: ["bare_metal", "governance", "min_req"]
          min_resources: 1
          min_polls: 2

    # Per-host health API (CAP05-01). Asserts the API returns a report per host
    # and the host is alert-free. Only runs for providers that implement the
    # query_host_health step. fail_on_classifications is omitted so ANY alert
    # (BMC sensor critical/failure, BmcLeakDetection/Leak, DPU heartbeat, ...)
    # fails the host; set it to scope failures to specific severities, or set
    # require_probes to enforce that specific signals are present.
    host_health:
      step: query_host_health
      checks:
        HostHealthCheck:
          test_id: "CAP05-01"
          labels: ["bare_metal", "health", "min_req"]
          require_report: true

    # Primitive-level health aggregation at the nodegroup/reservation level
    # (CAP05-02). Only runs for providers that implement the
    # query_health_aggregation step.
    health_aggregation:
      step: query_health_aggregation
      checks:
        HealthAggregationCheck:
          test_id: "CAP05-02"
          labels: ["bare_metal", "health", "min_req"]
          min_groups: 1

    # InfiniBand tenant isolation (SDN04-04). Verifies each tenant's IB
    # compute is scoped to its own P_Key partition (the subnet manager only
    # passes traffic between ports sharing a P_Key), so compute dedicated to
    # one tenant is isolated from other customers. Only runs for providers
    # that implement the query_ib_tenant_isolation step.
    ib_tenant_isolation:
      step: query_ib_tenant_isolation
      checks:
        IbTenantIsolationCheck:
          test_id: "SDN04-04"
          labels: ["bare_metal", "infiniband", "min_req", "network", "security"]
          min_partitions: 1

    # InfiniBand security keys (SDN04-05). The full requirement covers the
    # P_Key plus the OpenSM/SHARP subnet-manager keys (Management,
    # Aggregation Management, VendorSpecific, CongestionControl, Node2Node,
    # Manager2Node). required_keys is scoped to the keys NICo can observe:
    # the P_Key (NICo partition API) and the Management Key (UFM /app/smconf,
    # when UFM access is configured). The remaining subnet-manager keys live
    # on the UFM host and are reported as unverified. Only runs for providers
    # that implement the query_ib_keys step.
    ib_keys_configured:
      step: query_ib_keys
      checks:
        IbKeysConfiguredCheck:
          test_id: "SDN04-05"
          labels: ["bare_metal", "infiniband", "min_req", "network", "security"]
          required_keys: ["p_key", "management_key"]

    # Tenant-transition data sanitization (SEC21 / SEC22). Each check asserts
    # that a host which served a tenant is not returned to the allocatable pool
    # until it passes through the platform's sanitizing lifecycle stage. Only
    # runs for providers that implement the query_sanitization step.
    #   - SEC21-02: storage/disk securely erased on delete (low level).
    #   - SEC21-04: host (RAM) memory sanitization between tenants.
    #   - SEC21-05: SRAM/GPU memory sanitization between tenants (GPU hosts).
    #   - SEC21-06 / SEC22: TPM clear and BIOS/UEFI recommit on transition.
    memory_sanitization:
      step: query_sanitization
      checks:
        BmMemorySanitizationCheck:
          test_id: "SEC21-04"
          labels: ["bare_metal", "min_req", "sanitization", "security"]

    gpu_memory_sanitization:
      step: query_sanitization
      checks:
        BmGpuMemorySanitizationCheck:
          test_id: "SEC21-05"
          labels: ["bare_metal", "gpu", "min_req", "sanitization", "security"]

    firmware_reset:
      step: query_sanitization
      checks:
        BmFirmwareResetCheck:
          test_id: "SEC21-06"
          labels: ["bare_metal", "firmware", "min_req", "sanitization", "security"]

    # SEC21-02: confirm storage is sanitized on delete. Gates on the same
    # sanitizing lifecycle stage as the memory check, because that stage also
    # performs the NVMe/HDD secure erase and a host only returns to the pool
    # once it completes, so a prior tenant's on-disk data cannot leak forward.
    disk_sanitization:
      step: query_sanitization
      checks:
        BmDiskSanitizationCheck:
          test_id: "SEC21-02"
          labels: ["bare_metal", "disk", "min_req", "sanitization", "security"]

    # Failure-domain topology observability (STG05-01). Asserts every host
    # reports the physical failure domain (rack/enclosure) it belongs to, so a
    # tenant can spread storage/compute across independent domains for physical
    # diversity. Raise min_failure_domains above 1 to enforce that a site spans
    # multiple domains. Only runs for providers that implement the query_topology
    # step.
    failure_domain_observability:
      step: query_topology
      checks:
        FailureDomainObservabilityCheck:
          test_id: "STG05-01"
          labels: ["bare_metal", "sds_controller", "min_req"]
          min_failure_domains: 1

    # Break/fix skip-sanitization policy (STG02-01). Extends the SEC21
    # tenant-transition audit: a host may skip the sanitizing (Reset) stage when
    # it enters maintenance while still serving the same tenant. Tenant releases
    # must still pass through sanitizing before returning to the pool. Only runs
    # for providers that implement the query_sanitization step.
    breakfix_skip_sanitization:
      step: query_sanitization
      checks:
        SkipSanitizationBreakfixCheck:
          test_id: "STG02-01"
          labels: ["bare_metal", "min_req", "sanitization", "sds_controller"]

    # Stable admin IP observability (STG03-01). Asserts each host reports at
    # least one IP on its primary machineInterfaces entry so storage nodes have
    # queryable static addressing across lifecycle operations. Only runs for
    # providers that implement the query_stable_ips step.
    stable_storage_ips:
      step: query_stable_ips
      checks:
        StableStorageNodeIpCheck:
          test_id: "STG03-01"
          labels: ["bare_metal", "min_req", "network", "sds_controller"]

    # Out-of-band failure detection (STG04-01). Asserts the per-host health API
    # exposes BMC/out-of-band probes covering device failures at minimum. Only
    # runs for providers that implement the query_oob_health step.
    oob_failure_detection:
      step: query_oob_health
      checks:
        OobFailureDetectionCheck:
          test_id: "STG04-01"
          labels: ["bare_metal", "health", "min_req", "sds_controller"]

    # Hardware/firmware attestation (SEC22 / CNP09). Each check asserts a host
    # establishes a hardware root of trust. Only runs for providers that
    # implement the query_attestation step.
    #   - SEC22-01: each host passes a fresh nonce-based attestation (the
    #     verifier nonce is echoed in a validly signed quote).
    #   - CNP09-02: all firmware is cryptographically signed and its boot
    #     measurements are attested (secure boot on, golden PCR values matched).
    nonce_attestation:
      step: query_attestation
      checks:
        BmNonceAttestationCheck:
          test_id: "SEC22-01"
          labels: ["bare_metal", "security", "attestation"]

    firmware_attestation:
      step: query_attestation
      checks:
        BmFirmwareAttestationCheck:
          test_id: "CNP09-02"
          labels: ["attestation", "bare_metal", "firmware", "min_req", "security"]

    # Specified-key access to out-of-band components (AUTH-XX-03). Verifies a
    # tenant-specified key (e.g. an SSH key) can be used to access other
    # components "as possible" -- the serial console (SOL) being the verifiable
    # example, with network-device access reported as unverified (provider-
    # managed). Only runs for providers that implement the query_key_access
    # step.
    specified_key_access:
      step: query_key_access
      checks:
        BmComponentKeyAccessCheck:
          test_id: "AUTH03-01"
          labels: ["bare_metal", "iam", "security", "vm"]

    # ─── Break-fix (BFX01–BFX06) ─────────────────────────────────────
    # Bare-metal obligation for offtake Breakfix Requirements. Kubernetes-
    # only actions (GPU reset, cordon) live in k8s.yaml.

    hardware_serials:
      step: query_serial_numbers
      checks:
        BmHardwareSerialCheck:
          test_id: "BFX03-01"
          labels: ["bare_metal", "breakfix", "min_req"]
          min_machines: 1

    switch_firmware:
      step: query_switch_firmware
      checks:
        NvSwitchFirmwareCheck:
          test_id: "BFX03-02"
          labels: ["bare_metal", "breakfix", "min_req"]
          min_trays: 1

    bmc_kernel_logs:
      step: query_bmc_kernel_logs
      checks:
        BmcKernelLogCheck:
          test_id: "BFX03-03"
          labels: ["bare_metal", "breakfix", "min_req"]
          min_hosts: 1

    maintenance_events:
      step: query_maintenance_events
      checks:
        MaintenanceEventsCheck:
          test_id: "BFX02-01"
          labels: ["bare_metal", "breakfix", "min_req"]

    retirement_notices:
      step: query_retirement_notices
      checks:
        RetirementNoticesCheck:
          test_id: "BFX02-02"
          labels: ["bare_metal", "breakfix", "min_req"]

    repair_history:
      step: query_repair_history
      checks:
        RepairHistoryCheck:
          test_id: "BFX02-03"
          labels: ["bare_metal", "breakfix", "min_req"]

    # Report a node as needing repair while keeping it, and verify the provider
    # moves it into a repair state. The destructive counterpart is BFX01-02 below.
    report_node_repair:
      step: report_node_repair
      checks:
        ReportNodeRepairCheck:
          test_id: "BFX01-06"
          labels: ["bare_metal", "breakfix", "min_req"]

    return_node_maintenance:
      step: return_node_maintenance
      checks:
        ReturnNodeMaintenanceCheck:
          test_id: "BFX01-02"
          labels: ["bare_metal", "breakfix", "min_req"]

    return_rack_maintenance:
      step: return_rack_maintenance
      checks:
        ReturnRackMaintenanceCheck:
          test_id: "BFX01-03"
          labels: ["bare_metal", "breakfix", "min_req"]

    host_replacement:
      step: request_host_replacement
      checks:
        HostReplacementCheck:
          test_id: "BFX01-05"
          labels: ["bare_metal", "breakfix", "min_req"]

    node_health_agents:
      step: query_node_health_agents
      checks:
        NodeHealthAgentCheck:
          test_id: "BFX04-01"
          labels: ["bare_metal", "breakfix"]

    planned_maintenance_notification:
      step: query_planned_notifications
      checks:
        PlannedMaintenanceNotificationCheck:
          test_id: "BFX05-01"
          labels: ["bare_metal", "breakfix"]

    failure_notification:
      step: query_failure_notifications
      checks:
        FailureNotificationCheck:
          test_id: "BFX06-01"
          labels: ["bare_metal", "breakfix"]

  exclude:
    labels: []
