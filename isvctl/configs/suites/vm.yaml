# VM (Virtual Machine) Validation - Canonical Contract
#
# Validations-only contract for VM. Provider configs import this file
# and supply their own commands (steps + scripts).
#
# This file defines WHAT to validate, not HOW to run it. Each validation
# only inspects JSON output fields. As long as your scripts output the
# right fields, the validations pass regardless of which cloud you use.
#
# Quick start:
#   1. Copy providers/my-isv/config/vm.yaml to providers/<your-platform>/config/vm.yaml
#   2. Replace stub paths with your platform scripts
#   3. Run: uv run isvctl test run -f isvctl/configs/providers/<your-platform>/config/vm.yaml
#
# See also:
#   - my-isv living example: providers/my-isv/config/vm.yaml
#   - AWS reference: providers/aws/config/vm.yaml + providers/aws/scripts/vm/
#   - Per-step field breakdown: ../suites/README.md

version: "1.0"

tests:
  capability: vm
  cluster_name: "vm-validation"
  description: "VM (virtual machine) GPU validation tests"

  settings:
    # Provider-specific - override in your provider config
    region: ""
    instance_type: ""
    teardown_flag: "{{(env.VM_SKIP_TEARDOWN == 'true') | ternary('--skip-destroy', '')}}"

  # ─── Validations ─────────────────────────────────────────────────
  # These are PROVIDER-AGNOSTIC. They only check JSON field names/values.
  #
  # Layout mirrors bare_metal.yaml:
  #   launch checks -> list -> tags -> serial_console -> console_rbac
  #   -> component_key_access (AUTH03) -> cloud_init
  #   -> describe_instance (SSH / GPU / host anchor, post-reboot)
  #   -> lifecycle (stop / start / reboot)
  #   -> NIM -> teardown
  validations:
    # One row for one launch event: CNP01-09 is "create a VM node", which the
    # platform returning an id and the VM reaching running together establish.
    setup_checks:
      step: launch_instance
      checks:
        VmCreatedCheck:
          test_id: "CNP01-09"
          labels: ["min_req", "vm"]
          expected_state: "running"
          description: "Check the VM is created and reaches the running state"
          compose:
            - VmInstanceIdReportedCheck
            - InstanceStateCheck

    specified_key:
      step: launch_instance
      checks:
        VmLaunchedWithSpecifiedKeyCheck:
          test_id: "AUTH02-01"
          labels: ["vm"]

    component_key_access:
      step: component_key_access
      checks:
        VmComponentKeyAccessCheck:
          test_id: "AUTH03-01"
          labels: ["bare_metal", "iam", "security", "vm"]

    list_instances:
      step: list_instances
      checks:
        VmListedCheck:
          test_id: "CNP01-11"
          labels: ["min_req", "vm"]
          min_count: 1
          target_instance: "{{steps.launch_instance.instance_id}}"
          description: "Check the VM appears when instances are listed"
          compose:
            - InstanceListCheck

    tag_checks:
      step: verify_tags
      checks:
        VmTaggedCheck:
          test_id: "CNP05-02"
          labels: ["min_req", "vm"]
          required_keys: ["Name", "CreatedBy"]
          description: "Check the VM carries the required tags"
          compose:
            - InstanceTagCheck

    serial_console:
      step: serial_console
      checks:
        VmSerialConsoleCheck:
          test_id: "CNP06-03"
          labels: ["min_req", "vm"]
          description: "Check the VM's serial console is reachable"
          compose:
            - SerialConsoleCheck

    console_rbac:
      step: console_rbac
      checks:
        VmConsoleRbacCheck:
          test_id: "CNP01-16"
          labels: ["iam", "min_req", "security", "vm"]

    virtual_device_hardening:
      step: virtual_device_hardening
      checks:
        VirtualDeviceHardeningCheck:
          test_id: "CNP01-17"
          labels: ["min_req", "security", "vm"]

    cloud_init:
      step: launch_instance
      checks:
        VmCloudInitCheck:
          test_id: "BOOT02-02"
          labels: ["min_req", "ssh", "vm"]
          description: "Check cloud-init completed on the VM"
          compose:
            - CloudInitCheck

    # ─── Host-level validations anchored to describe_instance ────────
    # describe_instance runs AFTER reboot, so these checks prove the
    # host and its software survived the full stop/start/reboot lifecycle.
    instance_info:
      step: describe_instance
      checks:
        VmStateReportedCheck:
          test_id: "N/A"
          labels: ["vm"]
          expected_state: "running"
          description: "Check the platform reports the VM as running when described"
          compose:
            - InstanceStateCheck

    ssh:
      step: describe_instance
      checks:
        # Reachability and the OS image are separate plan items here, so they
        # stay separate tests.
        VmReachableOverSshCheck:
          test_id: "VMAAS01-01"
          labels: ["vm", "ssh"]
          description: "Check the VM answers SSH and runs commands"
          compose:
            - ConnectivityCheck
        VmOsImageCheck:
          test_id: "VMAAS05-01"
          labels: ["vm", "ssh"]
          expected_os: "ubuntu"
          description: "Check the VM runs the expected OS image"
          compose:
            - OsCheck

    gpu:
      step: describe_instance
      checks:
        VmGpusPresentCheck:
          test_id: "VMAAS06-01"
          labels: ["vm", "ssh", "gpu"]
          expected_gpus: 1
          description: "Check the VM exposes the expected number of GPUs"
          compose:
            - GpuCheck

    host_os:
      step: describe_instance
      checks:
        VmComputeTopologyCheck:
          test_id: "VMAAS09-01"
          labels: ["gpu", "ssh", "vm"]
          description: "Check the VM reports valid vCPU pinning, NUMA, and PCI/GPU topology"
          compose:
            - VcpuPinningCheck
            - PciBusCheck:
                expected_gpus: 1
        VmSoftwareStackCheck:
          test_id: "VMAAS07-01"
          labels: ["gpu", "ssh", "vm"]
          description: "Check the VM reports a usable host, kernel, and GPU software stack"
          compose:
            - HostSoftwareCheck
            - DriverCheck

    cpu_info:
      step: describe_instance
      checks:
        VmCpuInfoCheck:
          test_id: "N/A"
          labels: ["vm", "ssh"]
          description: "Check the VM reports its CPU topology"
          compose:
            - CpuInfoCheck

    container_runtime:
      step: describe_instance
      checks:
        VmContainerRuntimeCheck:
          test_id: "N/A"
          labels: ["vm", "ssh", "gpu", "workload", "slow"]
          description: "Check the VM runs a GPU-enabled container"
          compose:
            - ContainerRuntimeCheck

    # ─── Lifecycle validations ───────────────────────────────────────
    stop_checks:
      step: stop_instance
      checks:
        VmStoppedCheck:
          test_id: "CNP01-14"
          labels: ["min_req", "vm"]
          description: "Check the VM stops on request"
          compose:
            - InstanceStopCheck

    start_checks:
      step: start_instance
      checks:
        VmStartedCheck:
          test_id: "CNP01-15"
          labels: ["min_req", "vm"]
          description: "Check the VM starts again after being stopped"
          compose:
            - InstanceStartCheck
        VmIdentifierStableAfterStartCheck:
          test_id: "CNP08-03"
          labels: ["min_req", "vm"]
          reference_id: "{{steps.launch_instance.instance_id}}"
          description: "Check the VM keeps its identifier across a start"
          compose:
            - StableIdentifierCheck

    start_ssh:
      step: start_instance
      checks:
        VmReachableOverSshAfterStartCheck:
          test_id: "VMAAS01-01"
          labels: ["vm", "ssh"]
          description: "Check the VM answers SSH after a start"
          compose:
            - ConnectivityCheck
        VmOsImageAfterStartCheck:
          test_id: "VMAAS05-01"
          labels: ["vm", "ssh"]
          expected_os: "ubuntu"
          description: "Check the VM still runs the expected OS image after a start"
          compose:
            - OsCheck

    start_gpu:
      step: start_instance
      checks:
        VmGpusPresentAfterStartCheck:
          test_id: "VMAAS06-01"
          labels: ["vm", "ssh", "gpu"]
          expected_gpus: 1
          description: "Check the GPUs are still present after a start"
          compose:
            - GpuCheck

    reboot_checks:
      step: reboot_instance
      checks:
        VmRebootedCheck:
          test_id: "CNP01-13"
          labels: ["vm"]
          max_uptime: 600
          description: "Check the VM reboots on request"
          compose:
            - InstanceRebootCheck
        VmIdentifierStableAfterRebootCheck:
          test_id: "N/A"
          labels: ["min_req", "vm"]
          reference_id: "{{steps.launch_instance.instance_id}}"
          description: "Check the VM keeps its identifier across a reboot"
          compose:
            - StableIdentifierCheck

    reboot_state:
      step: reboot_instance
      checks:
        VmRunningAfterRebootCheck:
          test_id: "N/A"
          labels: ["vm"]
          expected_state: "running"
          description: "Check the VM returns to the running state after a reboot"
          compose:
            - InstanceStateCheck

    reboot_ssh:
      step: reboot_instance
      checks:
        VmReachableOverSshAfterRebootCheck:
          test_id: "VMAAS01-01"
          labels: ["vm", "ssh"]
          description: "Check the VM answers SSH after a reboot"
          compose:
            - ConnectivityCheck
        VmOsImageAfterRebootCheck:
          test_id: "VMAAS05-01"
          labels: ["vm", "ssh"]
          expected_os: "ubuntu"
          description: "Check the VM still runs the expected OS image after a reboot"
          compose:
            - OsCheck

    reboot_gpu:
      step: reboot_instance
      checks:
        VmGpusPresentAfterRebootCheck:
          test_id: "VMAAS06-01"
          labels: ["vm", "ssh", "gpu"]
          expected_gpus: 1
          description: "Check the GPUs are still present after a reboot"
          compose:
            - GpuCheck

    # ─── NIM validations ─────────────────────────────────────────────
    nim_inference:
      step: deploy_nim
      checks:
        VmNimInferenceReadyCheck:
          test_id: "VMAAS12-01"
          labels: ["vm", "ssh", "gpu", "workload", "slow"]
          description: "Check the deployed NIM is healthy, exposes its model, and answers an inference request"
          compose:
            - NimHealthCheck
            - NimModelCheck
            - NimInferenceCheck:
                prompt: "What is CUDA?"
                max_tokens: 50

    # ─── Teardown validations ────────────────────────────────────────
    nim_teardown:
      step: teardown_nim
      checks:
        VmNimDeploymentDeletedCheck:
          test_id: "N/A"
          labels: ["vm"]
          description: "Check the NIM deployment on the VM is removed"
          compose:
            - StepSuccessCheck

    teardown_checks:
      step: teardown
      checks:
        VmResourcesDeletedCheck:
          test_id: "N/A"
          labels: ["vm"]
          description: "Check the VM and its associated resources are deleted"
          compose:
            - StepSuccessCheck

  exclude:
    labels: []
