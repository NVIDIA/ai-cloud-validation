# Firebird Storage Provider Manifest (schema v1alpha2).
#
# Drives StorageProviderApiCheck ONLY, via the Firebird Filesystem API shim
# (../scripts/storage/firebird/api.py). config/storage.yaml's `setup` step
# publishes this file's path as steps.setup.storage.manifest_path.
#
# The declared identity + capabilities are a CONTRACT: StorageProviderApiCheck
# cross-checks them against the running shim's properties() and probes every
# surface declared supported. Keep this in sync with FirebirdFilesystemApi.
#
# No tenant_id: the tenant is the project's (FIREBIRD_PROJECT_ID), which a static
# manifest cannot name; the shim reports it from GET /projects/{p}.

schema_version: v1alpha2

namespace: firebird.ai
vendor:
  vendorName: Firebird

providers:
  - id: firebird-fs
    name: firebird-fs
    sdk_version: v1alpha1

    # A Firebird filesystem is mounted with the native parallel filesystem client (wekafs).
    provider:
      name: Firebird shared filesystem
      description: Firebird project filesystems on the tenant's WEKA organization, via the Filesystem API
      type: file
      protocols: [wekafs]
      version: 0.1.0

    backend:
      vendorName: WekaIO
      name: WEKA

    shim:
      kind: python
      # Resolved relative to this manifest's parent directory.
      module: ../scripts/storage/firebird/api.py

    # Volumes are filesystems: list/get read the project's filesystems,
    # create/delete go through POST/DELETE /projects/{p}/storage/fs (the shim
    # deletes only filesystems named isv-fs-*). getQuota is the tenant's
    # organization quota and allocation (/storage/fs/status). Directory and
    # user quotas and tenant listing have no tenant API.
    capabilities:
      tenantManagement:
        list: none
        get: none
        getQuota: native
        listQuotas: none
      volumeManagement:
        list: native
        get: native
        create: native
        delete: native
      quotaManagement:
        directory: none
        user: none
