# NICo Bare Metal (BMaaS) Validation Configuration
#
# Imports the provider-agnostic bare_metal contract and wires the NICo
# hardware-lifecycle and inventory steps. NICo currently implements hardware
# ingestion, DPU health, governance metrics, unified host-health, InfiniBand
# fabric security, tenant-transition sanitization, attestation, break-fix
# observability (with documented gaps for mutating workflows), and existing
# instance inventory checks. Full lifecycle and SSH-host validations remain
# excluded until those steps are wired for NICo.
#
# Architecture:
#   - verify_ingestion.py compares expected-machine manifest vs discovered
#     machines (joined by machineId); HardwareIngestionCheck validates it.
#   - check_dpu_health.py queries machine health data; BmDpuHealthCheck
#     validates DPU presence, heartbeat, and alerts.
#   - query_metrics.py aggregates per-status node and GPU counts into the
#     Delivered / Healthy / Reserved / Active governance buckets;
#     GovernanceMetricsCheck verifies the API contract (CAP01-01).
#   - query_fleet_inventory.py maps each machine (plus the site's location, which
#     is the region a NICo site sits in) onto the per-node record the resource
#     governance API must return; FleetManagementApiCheck verifies it (CAP02-01).
#   - query_resource_discovery.py polls the expected-machine manifest, NICo's
#     index of delivered capacity, so ResourceDiscoveryApiCheck can observe that
#     each record's identifier is stable across polls (CAP03-01). A delivery
#     reason is reported when the record states one (description, or an operator
#     label), but NICo reserves no field for it so the check does not gate on it.
#   - query_host_health.py reports each machine's health probes, alerts, and
#     classifications; HostHealthCheck validates the per-host report is
#     alert-free (CAP05-01). Leak detection (BmcLeakDetection/Leak) is included.
#   - query_health_aggregation.py rolls host health up to the nodegroup
#     primitive; HealthAggregationCheck validates it (CAP05-02).
#   - query_ib_tenant_isolation.py lists InfiniBand partitions with their
#     P_Key + owning tenant; IbTenantIsolationCheck verifies per-tenant
#     P_Key isolation (SDN04-04).
#   - query_ib_keys.py reports InfiniBand key configuration (P_Key from NICo,
#     Management Key from UFM when configured); IbKeysConfiguredCheck
#     validates the required keys (SDN04-05).
#   - query_sanitization.py maps each machine's status + statusHistory into a
#     neutral lifecycle token sequence; BmMemorySanitizationCheck (SEC21-04),
#     BmGpuMemorySanitizationCheck (SEC21-05), BmFirmwareResetCheck (SEC21-06/SEC22),
#     BmDiskSanitizationCheck (SEC21-02), and SkipSanitizationBreakfixCheck
#     (STG02-01) assert hosts are sanitized between tenants and that optional
#     maintenance skips preserve tenancy. The same Reset stage performs the
#     NVMe/HDD secure erase, so the disk check gates on the same lifecycle signal.
#   - query_stable_ips.py reads machineInterfaces[].ipAddresses; StableStorageNodeIpCheck
#     (STG03-01) asserts static admin IPs are queryable per host.
#   - query_oob_health.py maps BMC health probes into STG04 failure-category
#     observability; OobFailureDetectionCheck (STG04-01) asserts out-of-band
#     failure detection is exposed via the per-host health API.
#   - query_attestation.py maps control-plane SPDM and measured-boot status from
#     nico-admin-cli into the provider-neutral attestation contract (SEC22-01 /
#     CNP09-02). It requires operator/admin CLI credentials in addition to the
#     tenant REST credentials used for machine enumeration.
#   - query_key_access.py reads the site's SSH Key Groups and serial-console
#     configuration and reports whether a tenant-specified key can access
#     out-of-band components; BmComponentKeyAccessCheck validates it (AUTH-XX-03).
#     When no key group is synced to the site there is nothing to evidence access
#     with, so the step mints a throwaway key, observes the access path it
#     unlocks, and removes it again in the same process (create, test, remove).
#     That is the only mutating step in this config; pass --no-provision to keep
#     the run strictly read-only, at the cost of skipping AUTH-XX-03.
#   - list_instances.py / describe_instance.py query existing instances;
#     BmHostListedCheck and BmHostStateReportedCheck validate
#     the JSON contract.
#
# Prerequisites:
#   - NICO_API_BASE set to the NICo API base URL
#   - NICO_BEARER_TOKEN set, or OIDC client credentials configured via
#     NICO_SSA_ISSUER, NICO_CLIENT_ID, and NICO_CLIENT_SECRET
#   - Expected machines pre-registered; machines ingested and DPUs initialized
#   - NICO_ORGANIZATION and NICO_SITE_ID environment variables set
#   - Optional NICO_INSTANCE_ID narrows inventory checks to a known instance
#   - BFX01-02 is staging-only and mutating. It structured-skips unless both
#     NICO_BREAKFIX_MACHINE_ID names a dedicated fixture and
#     NICO_BREAKFIX_ALLOW_MUTATION=1 explicitly opts in.
#   - ssh-keygen on the host (used by query_key_access to mint the throwaway key)
#
# Usage:
#   NICO_BEARER_TOKEN=<token> NICO_ORGANIZATION=<org-name> NICO_SITE_ID=<uuid> \
#     uv run isvctl test run -f isvctl/configs/providers/nico/config/bare_metal.yaml

import:
  - ../../../suites/bare_metal.yaml

version: "1.0"

commands:
  bare_metal:
    phases: ["test"]
    steps:
      # ─── Verify Hardware Ingestion ─────────────────────────────────
      # Compares expected-machine manifest against discovered machines.
      # Output includes per-machine status, health, GPU/DPU counts.
      - name: verify_ingestion
        phase: test
        continue_on_failure: true
        command: "python ../scripts/hardware_ingestion/verify_ingestion.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── Check DPU Health ──────────────────────────────────────────
      # Queries NICo API for machine health data including DPU-specific
      # probes, agent heartbeat status, and capability inventory.
      - name: check_dpu_health
        phase: test
        continue_on_failure: true
        command: "python ../scripts/dpu/check_dpu_health.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── Query Governance Metrics ──────────────────────────────────
      # Aggregates every machine at the site into the Delivered / Healthy
      # / Reserved / Active governance buckets (CAP01-01). Counts are
      # produced for both nodes and GPUs.
      - name: query_governance_metrics
        phase: test
        continue_on_failure: true
        command: "python ../scripts/governance/query_metrics.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── Query Fleet Management Inventory (CAP02-01) ───────────────
      # Maps every machine at the site onto the per-node record the resource
      # governance API must return: identity, health classification, workload
      # and project binding, creation time, hardware type, GPU count, account,
      # in-use flag, and the site's location as the region.
      - name: query_fleet_inventory
        phase: test
        continue_on_failure: true
        command: "python ../scripts/governance/query_fleet_inventory.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── Poll Resource Discovery Index (CAP03-01) ──────────────────
      # Polls the expected-machine manifest -- NICo's Resource Index for
      # delivered capacity -- twice so ResourceDiscoveryApiCheck can observe
      # that each record's identifier is stable rather than take it on trust.
      - name: query_resource_discovery
        phase: test
        continue_on_failure: true
        command: "python ../scripts/governance/query_resource_discovery.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--polls"
          - "2"
          - "--poll-interval"
          - "5"
        timeout: 120

      # ─── Query Per-Host Health (CAP05-01) ──────────────────────────
      # Maps each machine's health probes into GPU state, thermal status,
      # and memory health, plus the freshness of the observation.
      - name: query_host_health
        phase: test
        continue_on_failure: true
        command: "python ../scripts/health/query_host_health.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── Aggregate Health by Nodegroup (CAP05-02) ──────────────────
      # Rolls per-host health up to the InstanceType (nodegroup) primitive
      # with per-group healthy/unhealthy counts and an aggregate status.
      - name: query_health_aggregation
        phase: test
        continue_on_failure: true
        command: "python ../scripts/health/query_health_aggregation.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── InfiniBand Tenant Isolation (SDN04-04) ────────────────────
      # Lists the site's InfiniBand partitions and reports each partition's
      # P_Key, owning tenant, and status. IbTenantIsolationCheck verifies
      # that each tenant's compute is scoped to its own P_Key (the subnet
      # manager enforces P_Key membership) and that no P_Key is shared
      # across tenants.
      - name: query_ib_tenant_isolation
        phase: test
        continue_on_failure: true
        command: "python ../scripts/infiniband/query_ib_tenant_isolation.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── InfiniBand Security Keys (SDN04-05) ───────────────────────
      # Reports InfiniBand key configuration: the P_Key from NICo's
      # partition API and the Management Key (M_Key) from UFM's /app/smconf
      # when UFM access is configured (UFM_ADDRESS + UFM_TOKEN). The
      # remaining OpenSM/SHARP keys live on the UFM host and are reported as
      # unverified. IbKeysConfiguredCheck validates the required subset.
      - name: query_ib_keys
        phase: test
        continue_on_failure: true
        command: "python ../scripts/infiniband/query_ib_keys.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── Audit Tenant-Transition Sanitization (SEC21-02/04/05/06) ──
      # Maps each machine's status + statusHistory into a neutral lifecycle
      # token sequence (Reset -> sanitizing, InUse -> in_use, Ready ->
      # available) so the sanitization checks can assert no host returned to
      # the pool without an intervening sanitizing stage. Also surfaces GPU
      # presence and firmware identity (vendor/product/BIOS). The disk check
      # (SEC21-02) reuses this gate since the Reset stage performs NVMe/HDD
      # secure erase.
      - name: query_sanitization
        phase: test
        continue_on_failure: true
        command: "python ../scripts/sanitization/query_sanitization.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── Query Failure-Domain Topology (STG05-01) ──────────────────
      # Reads each machine's rack label and reduces it to a per-host
      # failure-domain identifier plus the distinct set of failure domains at
      # the site. FailureDomainObservabilityCheck asserts the topology is
      # observable (every host maps to a named failure domain) so physical
      # diversity across racks/enclosures can be reasoned about.
      - name: query_topology
        phase: test
        continue_on_failure: true
        command: "python ../scripts/topology/query_topology.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── Query Stable Admin IPs (STG03-01) ─────────────────────────
      # Reads each machine's machineInterfaces[].ipAddresses (primary
      # interface first) so StableStorageNodeIpCheck can assert static admin
      # IPs are queryable across lifecycle operations.
      - name: query_stable_ips
        phase: test
        continue_on_failure: true
        command: "python ../scripts/storage/query_stable_ips.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── Query Out-of-Band Failure Detection (STG04-01) ────────────
      # Maps each machine's BMC health probes into STG04 failure-category
      # observability (device / network / memory / drive). OobFailureDetectionCheck
      # asserts the OOB health API is present and exposes BMC sensor coverage.
      - name: query_oob_health
        phase: test
        continue_on_failure: true
        command: "python ../scripts/health/query_oob_health.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── Query Attestation (SEC22-01 / CNP09-02) ────────────────────
      # Enumerates site machines via tenant REST, then reads SPDM attestation
      # and measured-boot status from the Forge control-plane API via
      # nico-admin-cli. The admin CLI is configured through its normal
      # environment (NICO_ADMIN_CLI, NICO_CARBIDE_URL,
      # NICO_FORGE_ROOT_CA_PATH, NICO_CLIENT_KEY_PATH, NICO_CLIENT_CERT_PATH).
      - name: query_attestation
        phase: test
        continue_on_failure: true
        command: "python ../scripts/attestation/query_attestation.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      # ─── Break-fix observability / lifecycle (BFX01–BFX06) ────────
      # Read-only where NICo exposes signals; mutating actions and missing
      # APIs emit structured skips with gap IDs (see scripts/breakfix/).
      - name: query_serial_numbers
        phase: test
        continue_on_failure: true
        command: "python ../scripts/hardware_inventory/query_serial_numbers.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      - name: query_maintenance_events
        phase: test
        continue_on_failure: true
        command: "python ../scripts/breakfix/query_maintenance_events.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      - name: query_retirement_notices
        phase: test
        continue_on_failure: true
        command: "python ../scripts/breakfix/gap_stub.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--gap"
          - "BFX02-02"
        timeout: 120

      - name: query_repair_history
        phase: test
        continue_on_failure: true
        command: "python ../scripts/breakfix/query_repair_history.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      - name: query_switch_firmware
        phase: test
        continue_on_failure: true
        command: "python ../scripts/breakfix/gap_stub.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--gap"
          - "BFX03-02"
        timeout: 120

      - name: query_bmc_kernel_logs
        phase: test
        continue_on_failure: true
        command: "python ../scripts/breakfix/query_bmc_kernel_logs.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      - name: return_node_maintenance
        phase: test
        continue_on_failure: true
        command: "python ../scripts/breakfix/return_node_maintenance.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--machine-id={{breakfix_machine_id}}"
          - "--allow-mutation={{breakfix_allow_mutation}}"
        # The subprocess must outlive both bounded PATCH calls and restoration
        # polling so its finally block cannot be killed before cleanup.
        timeout: 1200

      - name: return_rack_maintenance
        phase: test
        continue_on_failure: true
        command: "python ../scripts/breakfix/gap_stub.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--gap"
          - "BFX01-03"
        timeout: 600

      - name: request_host_replacement
        phase: test
        continue_on_failure: true
        command: "python ../scripts/breakfix/gap_stub.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--gap"
          - "BFX01-05"
        timeout: 900

      - name: query_node_health_agents
        phase: test
        continue_on_failure: true
        command: "python ../scripts/breakfix/gap_stub.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--gap"
          - "BFX04-01"
        timeout: 120

      - name: query_planned_notifications
        phase: test
        continue_on_failure: true
        command: "python ../scripts/breakfix/gap_stub.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--gap"
          - "BFX05-01"
        timeout: 120

      - name: query_failure_notifications
        phase: test
        continue_on_failure: true
        command: "python ../scripts/breakfix/gap_stub.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--gap"
          - "BFX06-01"
        timeout: 120

      # ─── Specified-Key Access (AUTH-XX-03) ──────────────────────────
      # Reads the site's SSH Key Groups and serial-console configuration from
      # the NICo API (/carbide/ segment, like the other NICo steps) and reports
      # whether a tenant-specified key can access out-of-band components. The serial
      # console (SOL) is verifiable from the tenant API (provider-enabled +
      # SSH-key auth + key synced); network-device access is provider-managed
      # and reported as unverified. BmComponentKeyAccessCheck validates it.
      #
      # When the site has no key group synced, this mints a throwaway key,
      # observes the access it unlocks, and removes it in a finally -- so the key
      # cannot outlive the run even if the process exits early. The timeout
      # covers a key-group sync poll (up to 180s) plus cleanup.
      - name: query_key_access
        phase: test
        continue_on_failure: true
        command: "python ../scripts/auth/query_key_access.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 420

      # ─── List Existing Instances ───────────────────────────────────
      # Lists instances visible to NICo at the configured site.
      - name: list_instances
        phase: test
        continue_on_failure: true
        command: "python ../scripts/bare_metal/list_instances.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--instance-id={{instance_id}}"
        timeout: 120

      # ─── Describe Existing Instance ────────────────────────────────
      # Describes NICO_INSTANCE_ID, or the first instance found at the site.
      - name: describe_instance
        phase: test
        continue_on_failure: true
        command: "python ../scripts/bare_metal/describe_instance.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--instance-id={{instance_id}}"
        timeout: 120

tests:
  cluster_name: "nico-bare-metal-validation"
  description: "Verify NICo bare-metal hardware ingestion, DPU health, governance, host health, break-fix observability, and instance inventory"

  settings:
    org: "{{env.NICO_ORGANIZATION}}"
    site_id: "{{env.NICO_SITE_ID}}"
    nico_api_base: "{{env.NICO_API_BASE}}"
    instance_id: "{{env.NICO_INSTANCE_ID}}"
    # BFX01-02 is mutating and never selects a Machine automatically. Set this
    # only to a dedicated staging fixture that the test may enter and leave
    # maintenance mode.
    breakfix_machine_id: "{{env.NICO_BREAKFIX_MACHINE_ID}}"
    breakfix_allow_mutation: "{{env.NICO_BREAKFIX_ALLOW_MUTATION}}"
    # The imported bare_metal suite defines these for the full instance
    # lifecycle, which NICo does not run yet. Blank them so the suite's
    # {{instance_type}} self-reference does not emit missing-variable warnings.
    region: ""
    instance_type: ""
    teardown_flag: ""

  # Adding describe_instance enables all suite checks anchored to that step.
  # Keep SSH, host GPU, interconnect, and workload checks out until their
  # scripts are wired. Exclude by validation name so NICo's wired fabric and
  # sanitization security checks are not suppressed by broad labels.
  exclude:
    labels: []
    tests:
      - BmHostReadyCheck
      - BmGpusPresentCheck
      - BmVcpuPinningCheck
      - BmPciBusCheck
      - BmHostSoftwareCheck
      - BmGpuStressCheck
      - BmNcclCheck
      - BmTrainingCheck
      - BmNvlinkCheck
      - BmInfiniBandCheck
      - BmEthernetCheck
      - BmGpuDriverCheck
      - BmCpuInfoCheck
      - BmContainerRuntimeCheck
