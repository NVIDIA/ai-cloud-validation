# Opt-in lifecycle for a reviewed, disposable CSI driver installation.
# Existing cluster credentials are supplied by KUBECTL / HELM.
# Set CSI_INSTALL_CONFIG and CSI_INSTALL_STATE to absolute local paths.
# Driver charts and Kustomize directories must use unique resource names and
# must not install a default StorageClass. Never point this at an existing driver.
version: "1.0"
import: ../suites/storage.yaml
commands:
  storage:
    phases: [setup, test, teardown]
    steps:
      - name: install_csi
        phase: setup
        command: "python3 shared/csi_driver.py install"
        requires: [kubernetes]
        output_schema: generic
        timeout: 900
      - name: setup_cluster
        phase: setup
        command: "my-isv/scripts/k8s/setup.sh"
        requires: [kubernetes]
        output_schema: generic
        timeout: 120
      - name: remove_csi
        phase: teardown
        command: "python3 shared/csi_driver.py remove"
        requires: [kubernetes]
        output_schema: generic
        timeout: 900
