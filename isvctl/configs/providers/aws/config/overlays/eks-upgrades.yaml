# Opt in only on a disposable CPU EKS cluster.
# See docs/references/kubernetes-upgrades.md for required env vars.
# Commands are relative to the first config file's directory, not this overlay.
# Command overlay: load after eks.yaml with a second -f argument.
version: "1.0"
commands:
  kubernetes:
    steps:
      - name: describe_managed_upgrade_policy
        phase: test
        command: "python3 ../scripts/eks/upgrade_test.py"
        args: ["--check=managed_upgrade_policy"]
        output_schema: k8s_upgrade
        timeout: 120
      - name: control_plane_upgrade_test
        phase: test
        command: "python3 ../scripts/eks/upgrade_test.py"
        args: ["--check=control_plane_upgrade"]
        output_schema: k8s_upgrade
        timeout: 7200
      - name: node_pool_upgrade_test
        phase: test
        command: "python3 ../scripts/eks/upgrade_test.py"
        args: ["--check=node_pool_upgrade"]
        output_schema: k8s_upgrade
        timeout: 7200
