# Network Operator connectivity validation for an ISV-provisioned cluster.
# The complete Launch Kit configuration and rendered deployment directory are
# prerequisites. This provider validates them, then always collects diagnostics:
#   l8k validate --user-config <file> --deployment-files <directory>
#   l8k sosreport --output-dir <artifact-dir>/sosreport

import:
  - ../../../suites/k8s-launch-kit/network-operator.yaml

version: "1.0"

tests:
  settings:
    k8s_launch_kit:
      executable: l8k
      user_config: ""
      deployment_files: ""
      working_dir: ../../../../../_output/k8s-launch-kit/network-operator/work
      artifact_dir: ../../../../../_output/k8s-launch-kit/network-operator/evidence
      environment: {}

commands:
  network_operator:
    phases: [test]
    steps:
      - name: launch_kit_validate
        phase: test
        command: python3 ../scripts/adapter.py
        args:
          - run
          - --executable
          - "{{ k8s_launch_kit.executable }}"
          - --command
          - validate
          - --arguments-json
          - "[]"
          - "--user-config={{ k8s_launch_kit.user_config }}"
          - "--deployment-files={{ k8s_launch_kit.deployment_files }}"
          - --environment-json
          - "{{ k8s_launch_kit.environment | tojson }}"
          - --working-dir
          - "{{ k8s_launch_kit.working_dir }}"
          - --artifact-dir
          - "{{ k8s_launch_kit.artifact_dir }}"
        # Launch Kit calculates the connectivity-matrix budget or honors the
        # timeout configured by the user, so it owns this command's deadline.
        timeout: null
        output_schema: k8s_launch_kit
        requires: [kubernetes]
        # The catalog tests report a failed validate; keep going so sosreport
        # still collects diagnostics. sosreport is not a catalog test.
        continue_on_failure: true

      - name: launch_kit_sosreport
        phase: test
        command: python3 ../scripts/adapter.py
        args:
          - run
          - --executable
          - "{{ k8s_launch_kit.executable }}"
          - --command
          - sosreport
          - --arguments-json
          - "[]"
          - --environment-json
          - "{{ k8s_launch_kit.environment | tojson }}"
          - --working-dir
          - "{{ k8s_launch_kit.working_dir }}"
          - --artifact-dir
          - "{{ k8s_launch_kit.artifact_dir }}"
        timeout: 1800
        output_schema: k8s_launch_kit
        requires: [kubernetes]
