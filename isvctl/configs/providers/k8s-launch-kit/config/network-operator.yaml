          - --command
          - deploy
          - --arguments-json
          - "{{ context.k8s_launch_kit.use_cases.roce_sriov.deploy.arguments | tojson }}"
          - --environment-json
          - "{{ context.k8s_launch_kit.environment | tojson }}"
          - --working-dir
          - "{{ context.k8s_launch_kit.use_cases.roce_sriov.working_dir }}"
          - --artifact-dir
          - "{{ context.k8s_launch_kit.use_cases.roce_sriov.artifact_dir }}"
        timeout: 7200
        output_schema: k8s_launch_kit
