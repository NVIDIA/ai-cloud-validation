          - --executable
          - "{{ steps.launch_kit_verify.executable }}"
          - --command
          - discover
          - --arguments-json
          - "{{ context.k8s_launch_kit.use_cases.roce_sriov.discover.arguments | tojson }}"
          - "--user-config={{ context.k8s_launch_kit.user_config }}"
          - --environment-json
          - "{{ context.k8s_launch_kit.environment | tojson }}"
          - --working-dir
          - "{{ context.k8s_launch_kit.use_cases.roce_sriov.working_dir }}"
          - --artifact-dir
          - "{{ context.k8s_launch_kit.use_cases.roce_sriov.artifact_dir }}"
