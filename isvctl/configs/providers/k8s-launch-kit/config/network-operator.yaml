# Production Network Operator workflow. It invokes the real l8k and kubectl
# executables inherited from provider.yaml. Test doubles live only under tests/.
#
# Usage:
#   ISVTEST_INCLUDE_UNRELEASED=1 uv run isvctl test run \
#     -f isvctl/configs/providers/k8s-launch-kit/config/network-operator.yaml \
#     --capability kubernetes --no-upload -- -v

import:
  - provider.yaml
  - ../../../suites/k8s-launch-kit/network-operator-use-cases.yaml

version: "1.0"

context:
  k8s_launch_kit:
    executable: l8k
    installation:
      mode: verify
      version: ""
      installer_ref: ""
      installer_sha256: ""
      prefix: ""
    # Optional complete Launch Kit configuration. Every selected use case
    # stages its own copy before discovery; the source file is never modified.
    user_config: ""
    # An empty override means the adapter invokes kubectl from PATH. Users may
    # replace this with any kubectl-compatible argv list in an overlay.
    kubectl_command: []
    environment: {}
    shared_artifact_dir: ../../../../../_output/k8s-launch-kit/network-operator/shared-evidence
    use_cases:
      roce_sriov:
        working_dir: ../../../../../_output/k8s-launch-kit/network-operator/use-cases/roce-sriov/work
        artifact_dir: ../../../../../_output/k8s-launch-kit/network-operator/use-cases/roce-sriov/evidence
        discover:
          arguments:
            - --fabric
            - ethernet
            - --deployment-type
            - sriov
        generate:
          arguments: []
        deploy:
          arguments: []
        validate:
          arguments: []
        clean:
          arguments: []
      infiniband_sriov:
        working_dir: ../../../../../_output/k8s-launch-kit/network-operator/use-cases/infiniband-sriov/work
        artifact_dir: ../../../../../_output/k8s-launch-kit/network-operator/use-cases/infiniband-sriov/evidence
        discover:
          arguments:
            - --fabric
            - infiniband
            - --deployment-type
            - sriov
        generate:
          arguments: []
        deploy:
          arguments: []
        validate:
          arguments: []
        clean:
          arguments: []
      roce_rdma_shared:
        working_dir: ../../../../../_output/k8s-launch-kit/network-operator/use-cases/roce-rdma-shared/work
        artifact_dir: ../../../../../_output/k8s-launch-kit/network-operator/use-cases/roce-rdma-shared/evidence
        discover:
          arguments:
            - --fabric
            - ethernet
            - --deployment-type
            - rdma_shared
        generate:
          arguments: []
        deploy:
          arguments: []
        validate:
          arguments: []
        clean:
          arguments: []
      infiniband_rdma_shared:
        working_dir: ../../../../../_output/k8s-launch-kit/network-operator/use-cases/infiniband-rdma-shared/work
        artifact_dir: ../../../../../_output/k8s-launch-kit/network-operator/use-cases/infiniband-rdma-shared/evidence
        discover:
          arguments:
            - --fabric
            - infiniband
            - --deployment-type
            - rdma_shared
        generate:
          arguments: []
        deploy:
          arguments: []
        validate:
          arguments: []
        clean:
          arguments: []
      roce_host_device:
        working_dir: ../../../../../_output/k8s-launch-kit/network-operator/use-cases/roce-host-device/work
        artifact_dir: ../../../../../_output/k8s-launch-kit/network-operator/use-cases/roce-host-device/evidence
        discover:
          arguments:
            - --fabric
            - ethernet
            - --deployment-type
            - host_device
        generate:
          arguments: []
        deploy:
          arguments: []
        validate:
          arguments: []
        clean:
          arguments: []
      infiniband_host_device:
        working_dir: ../../../../../_output/k8s-launch-kit/network-operator/use-cases/infiniband-host-device/work
        artifact_dir: ../../../../../_output/k8s-launch-kit/network-operator/use-cases/infiniband-host-device/evidence
        discover:
          arguments:
            - --fabric
            - infiniband
            - --deployment-type
            - host_device
        generate:
          arguments: []
        deploy:
          arguments: []
        validate:
          arguments: []
        clean:
          arguments: []

commands:
  network_operator:
    phases:
      - setup
      - launch-kit-verification
      - roce-sriov
      - infiniband-sriov
      - roce-rdma-shared
      - infiniband-rdma-shared
      - roce-host-device
      - infiniband-host-device
      - teardown
    continue_after_failure:
      - roce-sriov
      - infiniband-sriov
      - roce-rdma-shared
      - infiniband-rdma-shared
      - roce-host-device
      - infiniband-host-device
    steps:
      - name: launch_kit_prepare
        phase: setup
        command: python3 ../scripts/adapter.py
        args:
          - prepare
          - --mode
          - "{{ context.k8s_launch_kit.installation.mode }}"
          - --executable
          - "{{ context.k8s_launch_kit.executable }}"
          - "--version={{ context.k8s_launch_kit.installation.version }}"
          - "--installer-ref={{ context.k8s_launch_kit.installation.installer_ref }}"
          - "--installer-sha256={{ context.k8s_launch_kit.installation.installer_sha256 }}"
          - "--prefix={{ context.k8s_launch_kit.installation.prefix }}"
          - --environment-json
          - "{{ context.k8s_launch_kit.environment | tojson }}"
          - --artifact-dir
          - "{{ context.k8s_launch_kit.shared_artifact_dir }}"
        timeout: 900
        output_schema: k8s_launch_kit
        requires: [kubernetes]

      - name: launch_kit_verify
        phase: launch-kit-verification
        command: python3 ../scripts/adapter.py
        args:
          - verify
          - --executable
          - "{{ steps.launch_kit_prepare.executable | default(context.k8s_launch_kit.executable) }}"
          - "--expected-version={{ context.k8s_launch_kit.installation.version }}"
          - --environment-json
          - "{{ context.k8s_launch_kit.environment | tojson }}"
          - --artifact-dir
          - "{{ context.k8s_launch_kit.shared_artifact_dir }}"
        timeout: 60
        output_schema: k8s_launch_kit
        requires: [kubernetes]

      # roce-sriov: preflight -> discover -> generate -> deploy -> validate -> clean
      - name: launch_kit_roce_sriov_preflight
        phase: roce-sriov
        command: python3 ../scripts/adapter.py
        args:
          - preflight
          - --kubectl-command-json
          - "{{ context.k8s_launch_kit.kubectl_command | tojson }}"
          - --workflow-arguments-json
          - "{{ {'discover': context.k8s_launch_kit.use_cases.roce_sriov.discover.arguments, 'generate': context.k8s_launch_kit.use_cases.roce_sriov.generate.arguments, 'deploy': context.k8s_launch_kit.use_cases.roce_sriov.deploy.arguments, 'validate': context.k8s_launch_kit.use_cases.roce_sriov.validate.arguments, 'clean': context.k8s_launch_kit.use_cases.roce_sriov.clean.arguments} | tojson }}"
          - --environment-json
          - "{{ context.k8s_launch_kit.environment | tojson }}"
          - --working-dir
          - "{{ context.k8s_launch_kit.use_cases.roce_sriov.working_dir }}"
          - --artifact-dir
          - "{{ context.k8s_launch_kit.use_cases.roce_sriov.artifact_dir }}"
