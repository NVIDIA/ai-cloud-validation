# One channel-claiming pod per clique node, for the checks that allocate a
# compute domain (SDN18-02, SDN19-02).
#
# Loaded and mutated by the check; placeholder values keep this file valid
# YAML. Runtime code patches the name, namespace, image, and how long each pod
# holds its claim open, and replaces the node affinity wholesale - SDN19-02
# shrinks the domain by patching that same affinity, so both come from one
# place in the code rather than from here.
#
# The driver places no IMEX daemon until a channel claim is prepared, so these
# pods are what give the check a subject at all. They only have to hold their
# claims open, so they sleep; nothing is asserted about them, and they are
# expected to sit in ContainerCreating until the daemon on their node reports
# ready.
#
# Scheduling scope is the clique-label affinity alone. Tolerating every taint
# on top of it cannot widen that scope, and keeps a tenant's own node taints
# from stranding the claims - which the check would otherwise have to report
# as the driver failing to start a daemon.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: placeholder-claim
  namespace: placeholder
spec:
  selector:
    matchLabels:
      app: placeholder-claim
  template:
    metadata:
      labels:
        app: placeholder-claim
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: placeholder
                    operator: Exists
      tolerations:
        - operator: Exists
      containers:
        - name: claim
          image: placeholder
          command: ["sh", "-c", "sleep 0"]
          resources:
            claims:
              - name: imex-channel
      resourceClaims:
        - name: imex-channel
          resourceClaimTemplateName: placeholder-channel
