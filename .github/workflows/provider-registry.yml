# Fetches registered providers at their pinned commits and checks them against
# this checkout (scripts/check_registered_providers.py). A pull request checks
# only the entries it adds or changes, so a broken third-party entry cannot fail
# an unrelated one; the weekly run checks every entry against main.
name: Provider Registry

on:
  push:
    branches:
      - "pull-request/[0-9]+"
    paths:
      - "isvctl/configs/providers-registry/**"
      - "scripts/check_registered_providers.py"
      - ".github/workflows/provider-registry.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Fetched code belongs to the providers, not to this repository: read-only
# token, no secrets.
permissions:
  contents: read
  packages: read

jobs:
  check-registered-providers:
    name: Check registered providers
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    container:
      image: ghcr.io/nvidia/dsx-cds-tools:latest

    steps:
      # Full history, so the PR's changes can be diffed against its merge base
      # with main; no persisted token, since demo entries run provider scripts.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: uv sync

      # On a pull request, only the entries it adds or changes; if it changes
      # none (e.g. only this workflow or the script), every entry.
      - name: Check registered providers
        run: |
          names=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            names=$(git diff --name-only --diff-filter=AM origin/main...HEAD -- 'isvctl/configs/providers-registry/*.yaml' \
              | xargs -r -n1 basename | sed 's/\.yaml$//')
          fi
          # shellcheck disable=SC2086 # names is a space-separated list
          uv run python scripts/check_registered_providers.py $names
